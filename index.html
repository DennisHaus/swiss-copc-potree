<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Swiss LiDAR Viewer</title>

    <!-- Potree -->
    <link rel="stylesheet"
          href="./potree/build/potree/potree.css">

    <!-- Potree dependencies -->
    <link rel="stylesheet"
          href="./potree/libs/jquery-ui/jquery-ui.min.css">

    <link rel="stylesheet"
          href="./potree/libs/openlayers3/ol.css">

    <link rel="stylesheet"
          href="./potree/libs/spectrum/spectrum.css">

    <link rel="stylesheet"
          href="./potree/libs/jstree/themes/mixed/style.css">

    <!-- Leaflet -->
    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <!-- Application CSS -->
    <link rel="stylesheet"
          href="./style.css">
</head>

<body>

    <div id="app">

        <!-- =================================================
             MAP
             ================================================= -->

        <div id="map"></div>


        <!-- =================================================
             POTREE
             ================================================= -->

        <div id="potree-container">
            <div id="potree_render_area"></div>
        </div>


        <!-- =================================================
             TOP BAR
             ================================================= -->

        <div id="topbar">

            <div class="brand">
                Swiss LiDAR Viewer
            </div>

            <div class="brand-subtitle">
                swissSURFACE3D / COPC
            </div>

            <div class="top-actions">

                <button id="findTilesButton">
                    Find Tiles
                </button>

                <button id="fitButton">
                    Fit
                </button>

                <button id="clearButton">
                    Clear
                </button>

            </div>

        </div>


        <!-- =================================================
             TILE PANEL
             ================================================= -->

        <div id="tile-panel">

            <div class="panel-header">

                <h2>LiDAR Tiles</h2>

                <div id="tile-count">
                    0
                </div>

            </div>


            <!-- Search -->

            <div class="search-row">

                <input
                    id="search-input"
                    type="text"
                    placeholder="Search Swiss place..."
                    autocomplete="off"
                >

                <button id="search-button">
                    Search
                </button>

            </div>


            <!-- Search results -->

            <div id="search-results"></div>


            <!-- Help -->

            <div class="help">

                <strong>How to use</strong>

                <p>
                    Move or zoom the map, then click
                    <b>Find Tiles</b> to find SwissTopo
                    LiDAR COPC tiles in the current view.
                </p>

            </div>


            <!-- Tile list -->

            <div id="tile-list"></div>

        </div>


        <!-- =================================================
             SELECTED TILE
             ================================================= -->

        <div id="selected-panel">

            <div id="selected-title">
                No tile selected
            </div>

            <div id="selected-info"></div>

            <div class="selected-actions">

                <button
                    id="load-button"
                    disabled
                >
                    Load COPC
                </button>

                <button
                    id="unload-button"
                    disabled
                >
                    Unload
                </button>

            </div>

            <div class="display-controls">

    <label for="color-mode">
        Point color
    </label>

    <select id="color-mode">

        <option value="rgb">
            RGB
        </option>

        <option value="intensity">
            Intensity
        </option>

        <option value="classification">
            Classification
        </option>

        <option value="elevation">
            Elevation
        </option>

    </select>

</div>

        </div>


        <!-- =================================================
             STATUS
             ================================================= -->

        <div id="status">
            Loading...
        </div>


        <!-- =================================================
             POTREE SIDEBAR
             ================================================= -->

        <div id="potree_sidebar_container"></div>

    </div>


    <!-- =====================================================
         JAVASCRIPT DEPENDENCIES
         ===================================================== -->

    <script src="./potree/libs/jquery/jquery-3.1.1.min.js"></script>

    <script src="./potree/libs/spectrum/spectrum.js"></script>

    <script src="./potree/libs/jquery-ui/jquery-ui.min.js"></script>

    <script src="./potree/libs/other/BinaryHeap.js"></script>

    <script src="./potree/libs/tween/tween.min.js"></script>

    <script src="./potree/libs/d3/d3.js"></script>

    <script src="./potree/libs/proj4/proj4.js"></script>

    <script src="./potree/libs/openlayers3/ol.js"></script>

    <script src="./potree/libs/i18next/i18next.js"></script>

    <script src="./potree/libs/jstree/jstree.js"></script>

    <!-- COPC -->
    <script src="./potree/libs/copc/index.js"></script>

    <!-- Potree -->
    <script src="./potree/build/potree/potree.js"></script>

    <!-- LAS/LAZ -->
    <script src="./potree/libs/plasio/js/laslaz.js"></script>

    <!-- Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Application configuration -->
    <script src="./config.js"></script>

    <!-- Application -->
    <script src="./app.js"></script>

</body>
</html>
