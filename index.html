<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Swiss LiDAR COPC Viewer</title>

    <!-- Leaflet -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <!-- Potree -->
    <link
        rel="stylesheet"
        href="./vendor/potree/build/potree/potree.css"
    >

    <!-- jQuery UI -->
    <link
        rel="stylesheet"
        href="./vendor/potree/libs/jquery-ui/jquery-ui.min.css"
    >

    <!-- OpenLayers -->
    <link
        rel="stylesheet"
        href="./vendor/potree/libs/openlayers3/ol.css"
    >

    <!-- Spectrum -->
    <link
        rel="stylesheet"
        href="./vendor/potree/libs/spectrum/spectrum.css"
    >

    <!-- jsTree -->
    <link
        rel="stylesheet"
        href="./vendor/potree/libs/jstree/themes/mixed/style.css"
    >

    <link
        rel="stylesheet"
        href="./style.css"
    >

</head>

<body>

<div id="app">

    <!-- =========================================================
         LEFT MAP
         ========================================================= -->

    <div id="map"></div>


    <!-- =========================================================
         RIGHT POTREE VIEWER
         ========================================================= -->

    <div id="potree-container">

        <div id="potree_render_area"></div>

        <div id="potree_sidebar_container"></div>

    </div>


    <!-- =========================================================
         TOP BAR
         ========================================================= -->

    <div id="topbar">

        <div class="brand">
            Swiss LiDAR
        </div>

        <div class="brand-subtitle">
            swissSURFACE3D · COPC
        </div>

        <div class="top-actions">

            <button id="findTilesButton">
                Find tiles
            </button>

            <button id="fitButton">
                Fit
            </button>

            <button id="clearButton">
                Clear
            </button>

        </div>

    </div>


    <!-- =========================================================
         TILE PANEL
         ========================================================= -->

    <aside id="tile-panel">

        <div class="panel-header">

            <h2>LiDAR tiles</h2>

            <span id="tile-count">
                0
            </span>

        </div>


        <div class="search-row">

            <input
                id="search-input"
                type="text"
                placeholder="Search Swiss place..."
            >

            <button id="search-button">
                Search
            </button>

        </div>


        <div id="search-results"></div>


        <div class="help">

            <strong>Choose a tile</strong>

            <p>
                Zoom to your area, click
                <b>Find tiles</b>, then click a
                tile on the map or in the list.
            </p>

            <p>
                Selected tiles can be streamed
                directly from swisstopo.
            </p>

        </div>


        <div id="tile-list"></div>

    </aside>


    <!-- =========================================================
         SELECTED TILE PANEL
         ========================================================= -->

    <div id="selected-panel">

        <div id="selected-title">
            No tile selected
        </div>

        <div id="selected-info"></div>

        <div class="selected-actions">

            <button
                id="load-button"
                disabled
            >
                Load COPC
            </button>

            <button
                id="unload-button"
                disabled
            >
                Unload
            </button>

        </div>

    </div>


    <!-- =========================================================
         STATUS
         ========================================================= -->

    <div id="status">

        Ready.

    </div>

</div>


<!-- =============================================================
     LEAFLET
     ============================================================= -->

<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<!-- =============================================================
     POTREE DEPENDENCIES
     ============================================================= -->

<script
    src="./vendor/potree/libs/jquery/jquery-3.1.1.min.js">
</script>

<script
    src="./vendor/potree/libs/spectrum/spectrum.js">
</script>

<script
    src="./vendor/potree/libs/jquery-ui/jquery-ui.min.js">
</script>

<script
    src="./vendor/potree/libs/other/BinaryHeap.js">
</script>

<script
    src="./vendor/potree/libs/tween/tween.min.js">
</script>

<script
    src="./vendor/potree/libs/d3/d3.js">
</script>

<script
    src="./vendor/potree/libs/proj4/proj4.js">
</script>

<script
    src="./vendor/potree/libs/openlayers3/ol.js">
</script>

<script
    src="./vendor/potree/libs/i18next/i18next.js">
</script>

<script
    src="./vendor/potree/libs/jstree/jstree.js">
</script>

<script
    src="./vendor/potree/libs/copc/index.js">
</script>

<script
    src="./vendor/potree/libs/plasio/js/laslaz.js">
</script>


<!-- =============================================================
     POTREE
     ============================================================= -->

<script
    src="./vendor/potree/build/potree/potree.js">
</script>


<!-- =============================================================
     APPLICATION
     ============================================================= -->

<script src="./config.js"></script>

<script src="./app.js"></script>

</body>

</html>
